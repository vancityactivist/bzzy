; bzzy firmware
;
;   pio run -e waveshare_s3_touch_lcd169 -t upload   ; the target board (touch screen + LEDs)
;   pio run -e waveshare_s3_lcd169 -t upload         ; same board without touch
;   pio run -e esp32_generic -t upload               ; any plain ESP32 dev board (LEDs only)
;   pio test -e native                               ; status logic unit tests on your computer

[platformio]
default_envs = waveshare_s3_touch_lcd169

[env]
monitor_speed = 115200
lib_deps =
  fastled/FastLED@3.9.4
  bblanchon/ArduinoJson@7.2.1
  tzapu/WiFiManager@2.0.17
build_flags =
  -std=gnu++17
build_unflags =
  -std=gnu++11

; Waveshare ESP32-S3-Touch-LCD-1.69 (SKU 27350): the non-touch board plus a CST816T touch chip
[env:waveshare_s3_touch_lcd169]
extends = env:waveshare_s3_lcd169
build_flags =
  ${env.build_flags}
  -DBZZY_BOARD_WAVESHARE_S3_TOUCH_LCD169
  -DBZZY_HAS_DISPLAY=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-S3-LCD-1.69: ESP32-S3R8 (8 MB octal PSRAM), 16 MB flash, ST7789V2 240x280
[env:waveshare_s3_lcd169]
framework = arduino
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
lib_deps =
  ${env.lib_deps}
  lovyan03/LovyanGFX@1.2.0
  bitbank2/AnimatedGIF@2.1.1
build_flags =
  ${env.build_flags}
  -DBZZY_BOARD_WAVESHARE_S3_LCD169
  -DBZZY_HAS_DISPLAY=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1

; Generic ESP32 (WROOM) dev board for testing LEDs, Wi-Fi and syncing before the
; real board arrives. No screen.
[env:esp32_generic]
framework = arduino
platform = espressif32@6.9.0
board = esp32dev
board_build.filesystem = littlefs
build_flags =
  ${env.build_flags}
  -DBZZY_BOARD_GENERIC
  -DBZZY_HAS_DISPLAY=0

[env:native]
platform = native
lib_deps =
build_flags = -std=gnu++17
test_build_src = no
