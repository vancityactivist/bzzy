; bzzy firmware
;
;   pio run -e waveshare_s3_touch_lcd169 -t upload   ; the target board (touch screen + LEDs)
;   pio run -e waveshare_s3_lcd169 -t upload         ; same board without touch
;   pio run -e esp32_generic -t upload               ; any plain ESP32 dev board (LEDs only)
;   pio run -e esp32_lcd1602 -t upload               ; plain ESP32 + 16x2 character LCD (docs/esp32-test-build.md)
;   pio run -e waveshare_c6_lcd147 -t upload         ; Waveshare ESP32-C6-LCD-1.47 test board (docs/esp32-c6-test-build.md)
;   pio test -e native                               ; status logic unit tests on your computer

[platformio]
default_envs = waveshare_s3_touch_lcd169

[env]
monitor_speed = 115200
extra_scripts = pre:scripts/version.py
lib_deps =
  fastled/FastLED@3.9.4
  bblanchon/ArduinoJson@7.2.1
  tzapu/WiFiManager@2.0.17
build_flags =
  -std=gnu++17
build_unflags =
  -std=gnu++11

; Waveshare ESP32-S3-Touch-LCD-1.69 (SKU 27350): the non-touch board plus a CST816T touch chip
[env:waveshare_s3_touch_lcd169]
extends = env:waveshare_s3_lcd169
build_flags =
  ${env.build_flags}
  -DBZZY_BOARD_WAVESHARE_S3_TOUCH_LCD169
  -DBZZY_HAS_DISPLAY=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-S3-LCD-1.69: ESP32-S3R8 (8 MB octal PSRAM), 16 MB flash, ST7789V2 240x280
[env:waveshare_s3_lcd169]
framework = arduino
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
lib_deps =
  ${env.lib_deps}
  lovyan03/LovyanGFX@1.2.0
  bitbank2/AnimatedGIF@2.1.1
build_flags =
  ${env.build_flags}
  -DBZZY_BOARD_WAVESHARE_S3_LCD169
  -DBZZY_HAS_DISPLAY=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1

; Generic ESP32 (WROOM) dev board for testing LEDs, Wi-Fi and syncing before the
; real board arrives. No screen.
[env:esp32_generic]
framework = arduino
platform = espressif32@6.9.0
board = esp32dev
board_build.filesystem = littlefs
build_flags =
  ${env.build_flags}
  -DBZZY_BOARD_GENERIC
  -DBZZY_HAS_DISPLAY=0

; A plain ESP32 with a 16x2 HD44780 character LCD (the 16-pin parallel kind), an LED
; strip and a push button: a cheap way to try bzzy end to end. Wiring and flashing:
; docs/esp32-test-build.md. Change BZZY_LED_COUNT to match your strip.
[env:esp32_lcd1602]
extends = env:esp32_generic
lib_deps =
  ${env.lib_deps}
  arduino-libraries/LiquidCrystal@1.0.7
build_flags =
  ${env.build_flags}
  -DBZZY_BOARD_GENERIC
  -DBZZY_HAS_DISPLAY=0
  -DBZZY_HAS_TEXT_LCD=1
  -DBZZY_LED_COUNT=12

; Waveshare ESP32-C6-LCD-1.47: a test board with a 172x320 ST7789, one RGB LED and
; 4 MB of flash (no PSRAM). The C6 needs Arduino core 3.x, which PlatformIO's own
; espressif32 platform doesn't have, so this env uses the community pioarduino platform
; (pinned: 55.03.35 = Arduino core 3.3.5). docs/esp32-c6-test-build.md.
[env:waveshare_c6_lcd147]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
; Two 1.5 MB app slots for over-the-air updates, 896 KB of LittleFS for GIFs.
board_build.partitions = partitions/c6_4mb_ota.csv
board_build.filesystem = littlefs
lib_deps =
  ${env.lib_deps}
  lovyan03/LovyanGFX@1.2.0
  bitbank2/AnimatedGIF@2.1.1
build_flags =
  ${env.build_flags}
  -DBZZY_BOARD_WAVESHARE_C6_LCD147
  -DBZZY_HAS_DISPLAY=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
extra_scripts =
lib_deps =
build_flags = -std=gnu++17
test_build_src = no
